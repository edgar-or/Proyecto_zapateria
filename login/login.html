<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../bootstrap-5.3.3-dist/css/bootstrap.min.css">
	<link rel="icon" href="../imagenes/Index/logo-icono.ico" type="image/x-icon">
	<!-- Bootstrap Icons -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.css" rel="stylesheet">
	<link rel="stylesheet" href="../estilos/estilos-more.css">
	<title>Inicio</title>
	<style>
		/* Degradado para el fondo de la página */
		body {
			background: linear-gradient(135deg, rgb(193, 181, 187), #75787b);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0;
		}

		/* Estilo para el formulario de login */
		.login-section {
			background: linear-gradient(135deg, #333333, #242424);
			color: white;
			padding: 20px;
			width: 20rem;
			position: relative;
			border: none; /* Sin bordes redondeados */
		}

		.login-section button {
			background-color: #CC9E61;
		}

		.login-section a {
			color: #350699;
		}

		.login-section a:hover {
			color: #330c88;
		}

		/* Imagen en una esquina */
		.login-section img {
			position: absolute;
			top: 10px;
			right: 10px;
			width: 50px;
			height: 50px;
		}

		.back-button {
			background-color: #333333;
			width: 20rem;
			margin-top: 1rem;
			border: none;
		}

		.back-button a {
			color: white;
			text-decoration: none;
		}
	</style>
</head>

<body>
	<center>
		<section class="login-section">
			<!-- Imagen en la esquina -->
			<img src="../imagenes/001-Index/Logos/Logo.png" alt="logo" style="background-color:#CC9E61 ;">

			<p style="font-family: monospace; font-size: x-large;">LOGIN</p>
			<!--LOGIN-->
			<form action="usuarios_cliente.php" method="POST" class="formulario__login" style="width: 10rem;">
				<div class="mb-4">
					<label class="form-label fw-bold" for="usuario">Escriba su usuario:</label>
					<input class="form-control" placeholder="Ingrese su usuario" type="text" name="usuario" id="usuario" required />
				</div>
				<div class="mb-4">
					<label class="form-label fw-bold" for="contraseña">Escriba su contraseña:</label>
					<input class="form-control" placeholder="Ingrese su contraseña" type="password" maxlength="10" name="contraseña" id="contraseña" required />
				</div>
				<div class="d-grid">
					<button type="submit" class="btn">
						Iniciar Sesión
					</button>
				</div>
				<div class="my-3 w-100">
					<span><a target="_blank" href="../registrar_cliente/registrar_cliente.html">¿No tienes una cuenta?</a></span>
				</div>
			</form>
		</section>

		<div class="back-button d-grid">
			<button type="submit" class="btn">
				<a href="../index.html">
					Volver al inicio
				</a>
			</button>
		</div>
	</center>

	<!-- Script de Bootstrap -->
	<script src="../bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
