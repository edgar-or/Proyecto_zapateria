<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../bootstrap-5.3.3-dist/css/bootstrap.min.css">
	<link rel="icon" href="../imagenes/Index/logo-icono.ico" type="image/x-icon">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.css" rel="stylesheet">
	<link rel="stylesheet" href="../estilos/estilos-login.css">
	<title>Inicio</title>
</head>

<body>
	<center>
		<section class="login-section">
			<!-- Imagen en la esquina -->
			<img src="../imagenes/001-Index/Logos/Logo.png" alt="logo" style="background-color:#CC9E61 ;">

			<p style="font-family: monospace; font-size: x-large;">LOGIN</p>
			<!--LOGIN-->
			<form action="usuarios_cliente.php" method="POST" class="formulario__login" style="width: 10rem;">
				<div class="mb-4">
					<label class="form-label fw-bold" for="usuario">Escriba su usuario:</label>
					<input class="form-control" placeholder="Ingrese su usuario" type="text" name="usuario" id="usuario" required />
				</div>
				<div class="mb-4">
					<label class="form-label fw-bold" for="contraseña">Escriba su contraseña:</label>
					<input class="form-control" placeholder="Ingrese su contraseña" type="password" maxlength="10" name="contraseña" id="contraseña" required />
				</div>
				<div class="my-3 w-100">
					<!-- Nuevo botón para olvidar contraseña -->
					<span><a target="_blank" href="/recuperar_contraseña.html">¿Has olvidado tu contraseña?</a></span>
				</div>
				<div class="d-grid">
					<button type="submit" class="btn">
						Iniciar Sesión
					</button>
				</div>
				<div class="my-3 w-100">
					<span><a target="_blank" href="../registrar_cliente/registrar_cliente.html">¿No tienes una cuenta?</a></span>
				</div>
			</form>
		</section>

		<div class="back-button d-grid">
			<button type="submit" class="btn">
				<a href="../index.html">
					Volver al inicio
				</a>
			</button>
		</div>
	</center>

	<!-- Script de Bootstrap -->
	<script src="../bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
